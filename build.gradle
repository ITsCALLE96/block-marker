plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'block-marker'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"blockmarker" {
			sourceSet sourceSets.main
		}
	}
}

// Test-Client: startet Minecraft mit Sodium + Iris, baut eine kleine Szene und macht Screenshots
// (./gradlew runClientGameTest – Bilder landen in build/run/clientGameTest/screenshots)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "blockmarker-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom {
	runs {
		clientGameTest {
			vmArg "-Dblockmarker.screenshots=${file('build/block-marker-screenshots').absolutePath}"
		}
	}
}

// Shader-Pack und Iris-Einstellung in den frisch geleerten Test-Ordner legen (siehe testumgebung/LIESMICH.md)
tasks.named('runClientGameTest') {
	doFirst {
		copy {
			from 'testumgebung'
			into loom.runs.clientGameTest.runDir
			exclude 'LIESMICH.md'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu: Einstiegspunkt für den Einstellungs-Bildschirm (optional zur Laufzeit)
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Test-Client: so nah wie möglich am Pack
	runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	runtimeOnly "maven.modrinth:iris:${project.iris_version}"
	runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	gametestCompileOnly "maven.modrinth:iris:${project.iris_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
